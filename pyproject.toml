[project]
name = "guang-chen-agent-harness-test"
version = "0.1.0"
description = "从零实现的最小可用 Agent Runtime（不依赖任何 agent 框架）"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

# 本项目是应用而非可分发库，不做打包安装，
# 避免 Windows 上构建后端写 PE 资源被拒的问题。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
