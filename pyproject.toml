[project]
name = "guang-chen-agent-harness-test"
version = "0.1.0"
description = "从零实现的最小可用 Agent Runtime（不依赖任何 agent 框架）"
readme = "doc/PRD.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
